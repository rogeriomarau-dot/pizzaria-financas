function renderDRE(){
  const mes = state.dreMonth, ano = state.dreYear;

  const realizados = state.agenda
    .filter(a=> a.status==='Realizado' && sameMonth(a.data, mes, ano));
  const faturamentoBruto = realizados.reduce((s,a)=> s + Number(a.valor||0), 0);

  // Faturamento agrupado por Forma de Pagamento — usa o mesmo campo já
  // preenchido no agendamento (formaPagamento). Só aparecem as formas que
  // realmente têm algum valor lançado no mês, nunca uma lista fixa/estimada.
  const porFormaPagamento = {};
  realizados.forEach(a=>{
    const forma = a.formaPagamento || 'Não informada';
    if(!porFormaPagamento[forma]) porFormaPagamento[forma] = { total:0, itens:[] };
    porFormaPagamento[forma].total += Number(a.valor||0);
    porFormaPagamento[forma].itens.push(a);
  });
  const formasOrdenadas = Object.keys(porFormaPagamento).sort((a,b)=> porFormaPagamento[b].total - porFormaPagamento[a].total);

  const porCategoria = {};
  CATEGORIAS_DRE.forEach(c=> porCategoria[c] = { total:0, itens:[] });
  state.contas
    .filter(c=> sameMonth(c.dataVencimento, mes, ano))
    .forEach(c=>{
      porCategoria[c.categoria].total += Number(c.valor||0);
      porCategoria[c.categoria].itens.push(c);
    });

  const cmv = porCategoria['CMV'].total;
  const taxasCartao = porCategoria['Taxas de Cartão'].total;
  const comissoes = porCategoria['Comissões'].total;
  const taxasConvenio = porCategoria['Taxas de Convênio'].total;
  const impostos = porCategoria['Impostos'].total;
  const despesasOperacionais = porCategoria['Despesas Operacionais'].total;

  const margemBruta = faturamentoBruto - cmv - taxasCartao - comissoes - taxasConvenio - impostos;
  const resultadoOperacional = margemBruta - despesasOperacionais;

  const av = (v) => faturamentoBruto>0 ? (v/faturamentoBruto*100).toFixed(1)+'%' : '—';

  function linha(label, valor, opts={}){
    const cls = opts.cls || 'line-sub';
    const sign = opts.sign || '';
    return `<tr class="${cls}">
      <td>${label}${opts.drill? renderDrill(opts.drill):''}</td>
      <td class="val ${sign}">${formatMoney(valor)}<div class="dre-av">${av(valor)} da receita</div></td>
    </tr>`;
  }
  function renderDrill(categoria){
    const itens = porCategoria[categoria].itens;
    if(itens.length===0) return '';
    return `<div class="drilldown">${itens.map(i=>`<div>• ${escapeHtml(i.descricao)} (${escapeHtml(i.fornecedor||'—')}) — ${formatMoney(i.valor)}</div>`).join('')}</div>`;
  }
  function linhaReceita(forma){
    const dados = porFormaPagamento[forma];
    return `<tr class="line-receita">
      <td>${escapeHtml(forma)}</td>
      <td class="val">${formatMoney(dados.total)}<div class="dre-av">${av(dados.total)} da receita</div></td>
    </tr>`;
  }

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">DRE Gerencial</h1>
        <div class="page-sub">Demonstrativo de Resultado — regime de competência (por vencimento)</div>
      </div>
    </div>

    <div class="filters">
      <div class="field">
        <label>Mês</label>
        <select onchange="state.dreMonth=Number(this.value); renderMain();">${monthOptions(mes)}</select>
      </div>
      <div class="field">
        <label>Ano</label>
        <input type="number" style="width:100px" value="${ano}" oninput="state.dreYear=Number(this.value)||${ano}; renderMain();">
      </div>
    </div>

    <div class="card">
      <table class="dre-table">
        <tr class="line-total"><td>Faturamento Bruto</td><td class="val">${formatMoney(faturamentoBruto)}</td></tr>
        ${formasOrdenadas.map(f=> linhaReceita(f)).join('')}
        ${linha('CMV', cmv, {sign:'neg', drill:'CMV'})}
        ${linha('Taxas de Cartão', taxasCartao, {sign:'neg', drill:'Taxas de Cartão'})}
        ${linha('Comissões', comissoes, {sign:'neg', drill:'Comissões'})}
        ${linha('Taxas de Convênio', taxasConvenio, {sign:'neg', drill:'Taxas de Convênio'})}
        ${linha('Impostos', impostos, {sign:'neg', drill:'Impostos'})}
        <tr class="line-total"><td>Margem Bruta (Margem de Contribuição)</td><td class="val">${formatMoney(margemBruta)}<div class="dre-av">${av(margemBruta)} da receita</div></td></tr>
        ${linha('Despesas Operacionais', despesasOperacionais, {sign:'neg', drill:'Despesas Operacionais'})}
        <tr class="line-final"><td>Resultado Operacional (Lucro Líquido)</td><td class="val">${formatMoney(resultadoOperacional)}<div class="dre-av">${av(resultadoOperacional)} da receita</div></td></tr>
      </table>
    </div>

    <div class="card">
      <h3 style="margin-top:0;font-family:var(--font-display);color:var(--primary-dark);">Composição visual</h3>
      ${barraDRE('Faturamento Bruto', faturamentoBruto, faturamentoBruto)}
      ${barraDRE('CMV', cmv, faturamentoBruto)}
      ${barraDRE('Taxas de Cartão', taxasCartao, faturamentoBruto)}
      ${barraDRE('Comissões', comissoes, faturamentoBruto)}
      ${barraDRE('Taxas de Convênio', taxasConvenio, faturamentoBruto)}
      ${barraDRE('Impostos', impostos, faturamentoBruto)}
      ${barraDRE('Despesas Operacionais', despesasOperacionais, faturamentoBruto)}
      ${barraDRE('Resultado Operacional', Math.max(resultadoOperacional,0), faturamentoBruto)}
    </div>

    <div class="helper-note">📌 O Faturamento Bruto considera os agendamentos com status <b>"Realizado"</b> no mês selecionado, detalhado logo abaixo por <b>Forma de Pagamento</b> (conforme selecionado em cada agendamento). As demais linhas somam os lançamentos de <b>Contas a Pagar</b> cuja data de vencimento cai no mês, agrupados pela categoria escolhida em cada lançamento. Nenhum valor é estimado ou criado automaticamente — tudo vem de registros lançados manualmente.</div>
  `;
}
function barraDRE(label, valor, base){
  const pct = base>0 ? Math.min(100, (valor/base*100)) : 0;
  return `<div style="margin-bottom:10px;">
    <div style="display:flex; justify-content:space-between; font-size:12.5px;"><span>${label}</span><span>${formatMoney(valor)}</span></div>
    <div class="dre-bar-wrap"><div class="dre-bar" style="width:${pct}%;"></div></div>
  </div>`;
}

/* =========================================================
   BACKUP (export / import JSON) — protege dados que vivem
   somente no navegador deste computador
========================================================= */
function openBackupModal(){
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>Backup dos dados</h2>
        <p style="color:var(--muted); font-size:13px; margin-top:-8px;">Os dados deste sistema agora ficam salvos na nuvem (Firebase) e sincronizados entre todos os dispositivos automaticamente. Ainda assim, recomendamos exportar um backup de vez em quando como segurança extra.</p>
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
          <button class="btn btn-primary" onclick="exportBackup()">⬇️ Exportar backup (arquivo .json)</button>
          <label class="btn" style="text-align:center; cursor:pointer;">
            ⬆️ Importar backup (.json)
            <input type="file" accept="application/json" style="display:none" onchange="importBackup(event)">
          </label>
        </div>
        <div class="modal-actions">
          <div></div>
          <div class="modal-actions-right"><button class="btn" onclick="closeModal()">Fechar</button></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
}
function exportBackup(){
  const backup = {
    clientes: state.clientes,
    agenda: state.agenda,
    contas: state.contas,
    clinicName: state.clinicName,
    exportadoEm: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup_clinica_${toISODate(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm('Importar este backup vai SUBSTITUIR todos os dados atuais do sistema (na nuvem, para todos os dispositivos). Deseja continuar?')) return;

      const colecoes = { clientes: data.clientes||[], agenda: data.agenda||[], contas: data.contas||[] };

      for(const nome of Object.keys(colecoes)){
        const existentes = await db.collection(nome).get();
        let batch = db.batch();
        let ops = 0;
        for(const doc of existentes.docs){
          batch.delete(doc.ref);
          ops++;
          if(ops>=450){ await batch.commit(); batch = db.batch(); ops=0; }
        }
        for(const registro of colecoes[nome]){
          const { id, ...campos } = registro;
          batch.set(db.collection(nome).doc(), campos);
          ops++;
          if(ops>=450){ await batch.commit(); batch = db.batch(); ops=0; }
        }
        if(ops>0) await batch.commit();
      }

      if(data.clinicName){
        await db.collection('config').doc('clinica').set({ nome: data.clinicName }, { merge:true });
      }

      closeModal();
      alert('Backup importado com sucesso.');
    }catch(err){
      alert('Erro ao importar backup: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   MODAL GENÉRICO
========================================================= */
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

/* =========================================================
   LOGIN / LOGOUT
========================================================= */
function fazerLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginError');
  const loadingEl = document.getElementById('loginLoading');
  erroEl.style.display = 'none';

  if(!email || !senha){
    erroEl.textContent = 'Preencha email e senha.';
    erroEl.style.display = 'block';
    return;
  }
  loadingEl.style.display = 'block';

  const timeoutMs = 15000;
  const timeoutPromise = new Promise((_, reject)=> setTimeout(()=> reject({code:'timeout'}), timeoutMs));

  Promise.race([auth.signInWithEmailAndPassword(email, senha), timeoutPromise])
    .catch(err=>{
      loadingEl.style.display = 'none';
      const mensagens = {
        'auth/invalid-email': 'Email inválido.',
        'auth/user-not-found': 'Usuário não encontrado.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-credential': 'Email ou senha incorretos.',
        'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente novamente.',
        'auth/network-request-failed': 'Falha de conexão. Verifique o Wi-Fi/dados móveis e tente de novo.',
        'timeout': 'Demorou demais para responder. Verifique sua internet e tente novamente.'
      };
      erroEl.textContent = mensagens[err.code] || ('Erro ao entrar: ' + (err.message || 'tente novamente.'));
      erroEl.style.display = 'block';
    });
}
function fazerLogout(){
  if(!confirm('Sair do sistema?')) return;
  auth.signOut();
}

auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'flex';
    document.getElementById('loginLoading').style.display = 'none';
    document.getElementById('userBadge').textContent = user.email;
    document.getElementById('clinicNameLabel').textContent = state.clinicName;
    attachFirestoreListeners();
    renderNav();
    renderMain();
  } else {
    detachFirestoreListeners();
    state.clientes = []; state.agenda = []; state.contas = []; state.servicos = []; state.formasPagamento = [];
    document.getElementById('appRoot').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginSenha').value = '';
  }
});
</script>
